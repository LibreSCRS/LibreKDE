# SPDX-License-Identifier: LGPL-2.1-or-later
name: Packages

# The Debian/Ubuntu and Fedora packages, built and verified exactly as the
# release builds them in a rehearsal: LibreMiddleware and LibreAgent from the
# revisions deps.lock names, then this repository, in each slug's container,
# then the whole stack installed in a clean container and judged. It runs when
# something that decides the packages changes; the whole cross-repository
# matrix runs weekly in LibreSCRS/ci (stack-chain).

on:
  push:
    branches: [main, 'ci/**']
    paths:
      - 'packaging/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'deps.lock'
      - '.github/workflows/packages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packaging/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'deps.lock'
      - '.github/workflows/packages.yml'
  workflow_dispatch:

permissions: {}

jobs:
  packages:
    name: packages (${{ matrix.slug }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # No openSUSE Tumbleweed: its Plasma libraries carry no stable ABI to
        # build a package against.
        slug: [debian13, ubuntu2604, fedora43, fedora44]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: LibreSCRS/ci/actions/pkg-build@5b9410f9b0e6ab6983c39f931e118e68007c12b4
        id: build
        with:
          slug: ${{ matrix.slug }}
          upstream: source
      - uses: LibreSCRS/ci/actions/pkg-verify@5b9410f9b0e6ab6983c39f931e118e68007c12b4
        with:
          slug: ${{ matrix.slug }}
          packages: ${{ steps.build.outputs.art }}/${{ matrix.slug }}
          report: ${{ runner.temp }}/pkg-report
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pkg-report-${{ matrix.slug }}
          path: |
            ${{ steps.build.outputs.art }}/log
            ${{ runner.temp }}/pkg-report
          retention-days: 7
