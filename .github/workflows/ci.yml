# SPDX-License-Identifier: LGPL-2.1-or-later
name: CI

# LibreKDE is LM-free AND LibreLinux-free at build time: the plasmoid, Purpose
# plugin and card:/ KIO worker are thin clients that talk to the
# org.librescrs.Agent D-Bus service only at RUNTIME. The build-linux job
# checks out LibreSCRS/LibreAgent at the revision deps.lock names and builds it
# from source (Core off, LibreMiddleware disabled) to produce the
# LibreAgent::ClientQt library the build resolves via find_package(). Every
# component links that library, as do shared/agentclient and shared/signing, so
# the sibling checkout is a hard build-time dependency -- that sibling build
# never pulls in LibreMiddleware or LibreLinux, so the LM-free/LibreLinux-free
# invariant still holds.
#
# The gates shared with the other LibreSCRS repositories live in LibreSCRS/ci
# and are called by commit: which ones run here is profiles/LibreKDE.txt
# there, and every reference below names the same commit.

on:
  push:
    # ci/** as well: a change to the gates is proved on a runner before it
    # reaches main.
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  format-check:
    # Self-contained: the format gate needs no KDE deps, so it runs on Ubuntu
    # with the exact clang-format-21 the org pins (apt.llvm.org). The build job
    # runs in an Arch container, but Arch's rolling `clang` is ahead of 21 and
    # would reformat against a different major.
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Full history: the tarball-determinism check stamps the commit's own
      # time, and the version-stamp check derives versions from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install clang-format-21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Check clang-format
        # The roots live in ci/format-dirs.txt, which the shared format-scope
        # gate reads too: a directory nobody formats cannot appear without one
        # of the two saying so.
        #
        # -print0/-0 for paths with spaces, a parenthesised extension filter so
        # the -o cannot swallow the directory list, and -r because without it an
        # empty result makes clang-format read stdin and hang rather than fail.
        run: |
          mapfile -t dirs < <(grep -v '^#' ci/format-dirs.txt)
          find "${dirs[@]}" \
            \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.mm' \) -print0 \
            | xargs -0 -r clang-format-21 --dry-run --Werror

      # format scope, skip reasons, the workflows as data (wiring, bounds,
      # step order, one LibreSCRS/ci commit), the declaration registry and
      # duplicate bodies, this repository's own self-tests, deps.lock (form,
      # reachable from the upstream main, one revision per dependency), and
      # the release checks with the version this tree is heading for -- every
      # version surface against VERSION, the release workflow's asset set and
      # artefact producers, and a source tarball that is a function of the
      # commit -- so a disagreement shows weeks before the tag rather than on
      # a tag that cannot be taken back.
      - name: Shared gates
        uses: LibreSCRS/ci/actions/gates@373a0f82c9af280b7a8ccc4ee30106c947394ca2

      - name: The Arch recipe fetches the signed tag of this repository
        # The recipe's self-test runs with the other self-tests in the shared
        # gates step above; this is the gate over the committed recipe. It
        # reads the recipe as text and touches no network.
        run: ./packaging/arch/check-recipe.sh


  build-linux:
    # Arch container: the codebase targets current KF6 / Plasma 6, which
    # Ubuntu apt does not carry at the required versions. pacman provides
    # current ECM, Qt6, KF6 and Plasma 6 -- matching the LibreKDE PKGBUILD
    # dep set (packaging/arch/PKGBUILD).
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    container: archlinux:latest
    permissions:
      contents: read
    env:
      # Where LibreAgent's Qt client library is installed and where LibreKDE's
      # Configure step below points CMAKE_PREFIX_PATH.
      AGENT_PREFIX: /opt/libreagent-clientqt
      # Core OFF and LibreMiddleware disabled: this job's only reason to build
      # LibreAgent is to obtain LibreAgent::ClientQt, and LibreKDE itself must
      # stay LibreMiddleware-free at build time, so the sibling build it
      # depends on is held to the same rule.
      # CMAKE_DISABLE_FIND_PACKAGE_LibreMiddleware=ON is a deliberate backstop:
      # it turns any future accidental find_package(LibreMiddleware ...) in
      # this configuration into a hard configure error instead of a silent
      # success.
      # LIBREAGENT_INSTALL_WIRE_ARCHIVE=ON, though Wire is linked statically
      # into liblibrescrs-agentclient-qt.so: this prefix also carries the agent
      # doubles (LibreAgent::ClientQtTestSupport), whose imported target names
      # LibreAgent::Wire, and a prefix without it fails to configure HERE, a
      # long way from its cause.
      # The cache key below hashes this string, so changing a flag builds the
      # library again instead of restoring one configured differently.
      CLIENTQT_CMAKE_ARGS: >-
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DLIBREAGENT_BUILD_CORE=OFF
        -DLIBREAGENT_BUILD_WIRE=ON
        -DLIBREAGENT_BUILD_CLIENT_QT=ON
        -DLIBREAGENT_INSTALL_WIRE_ARCHIVE=ON
        -DCMAKE_DISABLE_FIND_PACKAGE_LibreMiddleware=ON
    steps:
      - name: Install system dependencies
        # Build deps from the LibreKDE PKGBUILD makedepends + the runtime KF6/
        # Plasma/Qt packages its find_package() calls need at configure time.
        # qt6-declarative supplies qmllint for the plasmoid QML lint step.
        # qt6-base + dbus also cover everything LibreAgent's ClientQt-only
        # build below needs.
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel cmake ninja git pkgconf \
            extra-cmake-modules \
            qt6-base qt6-declarative qt6-tools \
            ki18n kcoreaddons knotifications kconfig kio purpose \
            kirigami kdbusaddons \
            plasma-workspace libplasma \
            gtest dbus \
            python

      - name: Generate a UTF-8 locale
        # The bare Arch container ships only the C / C.UTF-8 locales, under which
        # the C library's gettext (which ki18n uses to read .mo catalogs)
        # suppresses translation. IdentityLabelTest proves labelKey→Serbian
        # resolution end-to-end and therefore needs a real UTF-8 locale present;
        # generate en_US.UTF-8 (the test sets LANG=en_US.UTF-8 + LANGUAGE=sr).
        run: |
          echo 'en_US.UTF-8 UTF-8' >> /etc/locale.gen
          locale-gen

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: LibreKDE
          persist-credentials: false

      # This job's only LibreAgent dependency is the installable,
      # component-filtered ClientQt CONFIG package (sonamed shared library)
      # that LibreKDE's components link directly -- the same package shape
      # distribution packaging installs.
      - name: Check out LibreAgent at the revision deps.lock names
        id: deps
        uses: LibreSCRS/ci/actions/checkout-deps@373a0f82c9af280b7a8ccc4ee30106c947394ca2
        with:
          root: LibreKDE
          names: LibreAgent
          path: .

      - name: Key the installed client library by what it was built from
        # The locked commit, the flags above, and the Qt and compiler the
        # rolling image carries today: Qt keeps binary compatibility only in
        # the newer-runtime direction, and objects from two compilers in one
        # prefix is how a restored cache turns into a crash nobody can place.
        id: clientqt
        env:
          LA_SHA: ${{ steps.deps.outputs.libreagent-sha }}
        run: |
          set -euo pipefail
          qt=$(pacman -Q qt6-base | cut -d' ' -f2)
          cxx=$(pacman -Q gcc | cut -d' ' -f2)
          args=$(printf '%s' "$CLIENTQT_CMAKE_ARGS" | sha256sum | cut -c1-16)
          echo "key=clientqt-$LA_SHA-qt$qt-gcc$cxx-$args" >> "$GITHUB_OUTPUT"

      - name: Restore the installed client library
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /opt/libreagent-clientqt
          key: ${{ steps.clientqt.outputs.key }}

      # No BUILD_TESTING flag: two independent gates in LibreAgent's own CMake
      # add its test binaries regardless of that variable, so all its suites
      # are configured and built as a side effect of this step -- this job
      # simply never runs them (no ctest call against this checkout).
      - name: Build & install LibreAgent (ClientQt only, LM-free)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: LibreAgent
        run: |
          # shellcheck disable=SC2086  # the flags split into argv on purpose
          cmake -B build -G Ninja $CLIENTQT_CMAKE_ARGS
          cmake --build build -j4
          cmake --install build --prefix "$AGENT_PREFIX"

      # Explicit component flags pin the package contract (their CMake option
      # defaults are already ON, but pin them so CI matches the PKGBUILD).
      - name: Configure
        working-directory: LibreKDE
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLIBREKDE_BUILD_PLASMOID=ON \
            -DLIBREKDE_BUILD_PURPOSE=ON \
            -DLIBREKDE_BUILD_KIO=ON \
            -DLIBREKDE_BUILD_CREDENTIALS=ON \
            -DBUILD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="$AGENT_PREFIX"

      - name: Build
        working-directory: LibreKDE
        run: |
          # set -o pipefail is explicit: without it `| tee` reports tee's status
          # and a failed build becomes a green step, after which the warning
          # check measures a log that was never produced.
          set -o pipefail
          LC_ALL=C cmake --build build -j4 2>&1 | tee build.log

      # The warning baseline (counted by the [-Wname] tag, never by the message
      # text; a compiler the baseline has no section for fails, and the floor
      # of compile units is judged against the configured graph) and the
      # discovered test set. Test discovery is PRE_TEST here, so `ctest -N`
      # runs every test binary with --gtest_list_tests; the Qt ones create
      # their application object before listing, and with no display that
      # aborts -- so the set is discovered under the same platform plugin the
      # Test step uses.
      - name: Shared gates after the build
        uses: LibreSCRS/ci/actions/gates@373a0f82c9af280b7a8ccc4ee30106c947394ca2
        env:
          QT_QPA_PLATFORM: offscreen
        with:
          root: LibreKDE
          phase: build
          build-dir: build
          build-log: build.log
          leg: linux

      # qmllint over the plasmoid QML (Qt6 qmllint, shipped by qt6-declarative).
      # On Arch the Qt6 qmllint lives in $(qmake6 -query QT_INSTALL_BINS)
      # (e.g. /usr/lib/qt6/bin), NOT on PATH.
      - name: qmllint (plasmoid QML)
        working-directory: LibreKDE
        run: |
          QMLLINT="$(qmake6 -query QT_INSTALL_BINS)/qmllint"
          find components/plasmoid -name "*.qml" -print0 | xargs -0 -r "$QMLLINT"

      # offscreen for the Qt/KDE widget tests; dbus-run-session provides a
      # private session bus the agentclient D-Bus tests connect to. No
      # LIBRESCRS_TEST_PIN: there is no card/secret path in these clients.
      # --no-tests=error: without it ctest reports success when it finds no
      # tests at all, so a configuration that registered none would pass.
      - name: Test
        working-directory: LibreKDE
        env:
          QT_QPA_PLATFORM: offscreen
        run: dbus-run-session -- ctest --test-dir build --output-on-failure --no-tests=error
